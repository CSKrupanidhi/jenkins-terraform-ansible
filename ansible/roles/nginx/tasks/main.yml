---
- name: Update Ubuntu package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Ensure Nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Create custom website
  ansible.builtin.copy:
   dest: /var/www/html/index.html
   content: |
     <!DOCTYPE html>
     <html>
     <head>
       <title>Jenkins Ansible Deployment</title>
     </head>
     <body>
       <h1>Welcome</h1>
       <h2>Deployed using Jenkins, Terraform and Ansible</h2>
     </body>
     </html>
   owner: root
   group: root
   mode: '0644'

