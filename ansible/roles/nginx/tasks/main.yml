-name: Create custom website
 ansible.builtin.copy:
   dest: /var/www/html/index.html
   content: |
     <!DOCTYPE html>
     <html>
     <head>
       <title>Jenkins Ansible Deployment</title>
     </head>
     <body>
       <h1>Welcome</h1>
       <h2>Deployed using Jenkins, Terraform and Ansible</h2>
     </body>
     </html>
   owner: root
   group: root
   mode: '0644'

